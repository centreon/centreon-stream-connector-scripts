name: stream-connectors

# triggered by stream-connectors-ci.yml
on:
  workflow_call:
    inputs:
      use_local_lib:
        description: "Test the stream connectors against the library packages built earlier in the same run"
        type: boolean
        default: false
      build_all_connectors:
        description: "Build and test all the stream connectors, used for CI changes (only the changed ones are delivered)"
        type: boolean
        default: false
      test_published_connectors:
        description: "Test the published packages of the stream connectors that are not built in this run, used for library changes"
        type: boolean
        default: false

jobs:
  get-environment:
    uses: ./.github/workflows/get-environment.yml

  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      # connectors to build and test
      connectors: ${{ steps.list-connectors.outputs.connectors }}
      # connectors to deliver, only the ones that changed
      delivered_connectors: ${{ steps.list-connectors.outputs.delivered_connectors }}
      # space separated packages of the connectors that are not built, tested from the repositories
      published_packages: ${{ steps.list-connectors.outputs.published_packages }}
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          list-files: shell
          filters: |
            connectors:
              - added|modified: centreon-certified/**
            # changes of the CI files are handled by stream-connectors-ci.yml (build_all_connectors input)
            packaging:
              - added|modified: packaging/connectors/**

      - name: Transform to directories
        id: list-connectors
        env:
          CONNECTOR_FILES: ${{ steps.filter.outputs.connectors_files }}
          PACKAGING_CHANGED: ${{ steps.filter.outputs.packaging }}
          BUILD_ALL_CONNECTORS: ${{ inputs.build_all_connectors }}
          TEST_PUBLISHED_CONNECTORS: ${{ inputs.test_published_connectors }}
        run: |
          folders=()
          mapfile -t all_folders < <(find centreon-certified/ -maxdepth 1 -mindepth 1 -type d -exec basename {} \;)
          if [ "$PACKAGING_CHANGED" = "true" ]; then
            echo "Packaging files changed, adding all connectors"
            folders=("${all_folders[@]}")
          else
            for f in $CONNECTOR_FILES; do
              DIR_NAME="$(dirname "$f")"
              BASE_NAME="$(basename "$DIR_NAME")"
              echo "Adding $BASE_NAME to folders"
              folders+=($BASE_NAME)
            done
          fi
          unique_folders=($(printf "%s\n" "${folders[@]}" | sort -u | tr '\n' ' '))
          echo "delivered_connectors=$(jq --compact-output --null-input '$ARGS.positional' --args -- ${unique_folders[@]})" >> $GITHUB_OUTPUT

          if [ "$BUILD_ALL_CONNECTORS" = "true" ]; then
            echo "CI changed, building and testing all connectors"
            unique_folders=($(printf "%s\n" "${all_folders[@]}" | sort -u | tr '\n' ' '))
          fi
          echo "connectors=$(jq --compact-output --null-input '$ARGS.positional' --args -- ${unique_folders[@]})" >> $GITHUB_OUTPUT

          # the connectors that are not built in this run are tested with their published packages
          published_packages=()
          if [ "$TEST_PUBLISHED_CONNECTORS" = "true" ]; then
            for folder in "${all_folders[@]}"; do
              if [[ ! " ${unique_folders[*]} " =~ " ${folder} " ]]; then
                published_packages+=("centreon-stream-connector-${folder}")
              fi
            done
            echo "Library changed, testing published packages: ${published_packages[*]}"
          fi
          echo "published_packages=${published_packages[*]}" >> $GITHUB_OUTPUT
        shell: bash

  package:
    if: ${{ needs.detect-changes.outputs.connectors != '[]' }}
    needs: [get-environment, detect-changes]
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 25
      matrix:
        distrib: [el8, el9, el10, bookworm, trixie]
        connector_path: ${{ fromJson(needs.detect-changes.outputs.connectors) }}
        include:
          - distrib: el8
            image: packaging-stream-connectors-nfpm-alma8
            package_extension: rpm
          - distrib: el9
            image: packaging-stream-connectors-nfpm-alma9
            package_extension: rpm
          - distrib: el10
            image: packaging-stream-connectors-nfpm-alma10
            package_extension: rpm
          - distrib: bookworm
            image: packaging-stream-connectors-nfpm-bookworm
            package_extension: deb
          - distrib: trixie
            image: packaging-stream-connectors-nfpm-trixie
            package_extension: deb

    name: Package ${{ matrix.distrib }} ${{ matrix.connector_path }}
    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.image }}:latest
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    steps:

      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Replace package and connector name variables
        env:
          CONNECTOR_PATH: ${{ matrix.connector_path }}
        run: |
          package_name="centreon-stream-connector-$(basename "$CONNECTOR_PATH")"
          sed -i "s/@PACKAGE_NAME@/${package_name}/g" ./packaging/connectors/centreon-stream-connectors.yaml
          connector_name="$(basename "$CONNECTOR_PATH")"
          sed -i "s/@CONNECTOR_NAME@/${connector_name}/g" ./packaging/connectors/centreon-stream-connectors.yaml
        shell: bash

      - name: Add specific dependencies
        env:
          CONNECTOR_PATH: ${{ matrix.connector_path }}
          DISTRIB: ${{ matrix.distrib }}
        run: |
          # Debian renamed libcurl4 to libcurl4t64 with the 64-bit time_t transition,
          # and provides no libcurl4 virtual package from trixie onwards.
          if [ "$DISTRIB" = "trixie" ]; then
            DEB_CURL="libcurl4t64"
          else
            DEB_CURL="libcurl4"
          fi
          DEB_DEPENDENCIES="$DEB_CURL"
          RPM_DEPENDENCIES="libcurl"
          if [ "$CONNECTOR_PATH" = "elastic" ]; then
            DEB_DEPENDENCIES="lua-sec"
            RPM_DEPENDENCIES="lua-sec"
          elif [ "$CONNECTOR_PATH" = "influxdb" ]; then
            DEB_DEPENDENCIES="$DEB_CURL,lua-sec"
            RPM_DEPENDENCIES="libcurl,lua-sec"
          elif [ "$CONNECTOR_PATH" = "google" ]; then
            DEB_DEPENDENCIES="$DEB_CURL,lua-openssl"
            RPM_DEPENDENCIES="libcurl,lua-openssl"
          elif [ "$CONNECTOR_PATH" = "kafka" ]; then
            DEB_DEPENDENCIES="librdkafka1,lua-cffi"
            RPM_DEPENDENCIES="librdkafka,lua-cffi"
          elif [ "$CONNECTOR_PATH" = "pagerduty" ]; then
            DEB_DEPENDENCIES="$DEB_CURL,lua-tz"
            RPM_DEPENDENCIES="libcurl,lua-tz"
          elif [ "$CONNECTOR_PATH" = "splunk" ]; then
            DEB_DEPENDENCIES="$DEB_CURL,lua-tz"
            RPM_DEPENDENCIES="libcurl,lua-tz"
          fi
          sed -i "s/@RPM_DEPENDENCIES@/$RPM_DEPENDENCIES/g;" ./packaging/connectors/centreon-stream-connectors.yaml
          sed -i "s/@DEB_DEPENDENCIES@/$DEB_DEPENDENCIES/g;" ./packaging/connectors/centreon-stream-connectors.yaml
        shell: bash

      - name: Export package version
        id: package-version
        run: echo "package_version=`date '+%Y%m%d'`" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "packaging/connectors/centreon-stream-connectors.yaml"
          distrib: ${{ matrix.distrib }}
          version: ${{ steps.package-version.outputs.package_version }}
          release: "1"
          package_extension: ${{ matrix.package_extension }}
          arch: all
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.connector_path }}-${{ matrix.distrib }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          artifact_name: "package-${{ matrix.connector_path }}-${{ matrix.distrib }}"

  test-packages:
    needs: [get-environment, detect-changes, package]
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        distrib: [el8, el9, el10, bookworm, trixie]
        connector_path: ${{ fromJson(needs.detect-changes.outputs.connectors) }}
        include:
          - distrib: el8
            package_extension: rpm
            image: almalinux:8
          - distrib: el9
            package_extension: rpm
            image: almalinux:9
          - distrib: el10
            package_extension: rpm
            image: almalinux:10
          - distrib: bookworm
            package_extension: deb
            image: debian:bookworm
          - distrib: trixie
            package_extension: deb
            image: debian:trixie
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    name: Test ${{ matrix.distrib }} ${{ matrix.connector_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test packaged connector
        uses: ./.github/actions/test-packages
        with:
          package_extension: ${{ matrix.package_extension }}
          distrib: ${{ matrix.distrib }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.connector_path }}-${{ matrix.distrib }}
          # must match the cache_key of the package job in stream-connectors-lib.yml
          lib_cache_key: ${{ inputs.use_local_lib && format('{0}-{1}-{2}-{3}', github.sha, github.run_id, matrix.package_extension, matrix.distrib) || '' }}
          test_type: stream-connector

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install_error_log_${{ matrix.connector_path }}_${{ matrix.distrib }}
          path: install_error_${{ matrix.distrib }}.log

  # the published packages of the connectors are tested against the library built in this run
  test-published-packages:
    if: ${{ needs.detect-changes.outputs.published_packages != '' }}
    needs: [detect-changes]
    strategy:
      fail-fast: false
      matrix:
        distrib: [el8, el9, el10, bookworm, trixie]
        include:
          - distrib: el8
            package_extension: rpm
            image: almalinux:8
          - distrib: el9
            package_extension: rpm
            image: almalinux:9
          - distrib: el10
            package_extension: rpm
            image: almalinux:10
          - distrib: bookworm
            package_extension: deb
            image: debian:bookworm
          - distrib: trixie
            package_extension: deb
            image: debian:trixie
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    name: Test published ${{ matrix.distrib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test published connectors
        uses: ./.github/actions/test-packages
        with:
          package_extension: ${{ matrix.package_extension }}
          distrib: ${{ matrix.distrib }}
          published_packages: ${{ needs.detect-changes.outputs.published_packages }}
          # must match the cache_key of the package job in stream-connectors-lib.yml
          lib_cache_key: ${{ inputs.use_local_lib && format('{0}-{1}-{2}-{3}', github.sha, github.run_id, matrix.package_extension, matrix.distrib) || '' }}
          test_type: stream-connector

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install_error_log_published_${{ matrix.distrib }}
          path: install_error_${{ matrix.distrib }}.log

  deliver-rpm:
    if: ${{ contains(fromJson('["unstable", "testing", "stable"]'), needs.get-environment.outputs.stability) && needs.detect-changes.outputs.delivered_connectors != '[]' }}
    needs: [get-environment, detect-changes, package, test-packages]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        distrib: [el8, el9, el10]
        connector_path: ${{ fromJson(needs.detect-changes.outputs.delivered_connectors) }}
    name: Deliver ${{ matrix.distrib }} ${{ matrix.connector_path }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish RPM packages
        uses: ./.github/actions/rpm-delivery
        with:
          module_name: stream-connectors
          distrib: ${{ matrix.distrib }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-${{ matrix.connector_path }}-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}

  deliver-deb:
    if: ${{ contains(fromJson('["unstable", "testing", "stable"]'), needs.get-environment.outputs.stability) && needs.detect-changes.outputs.delivered_connectors != '[]' }}
    needs: [get-environment, detect-changes, package, test-packages]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        distrib: [bookworm, trixie]
        connector_path: ${{ fromJson(needs.detect-changes.outputs.delivered_connectors) }}
    name: Deliver ${{ matrix.distrib }} ${{ matrix.connector_path }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish DEB packages
        uses: ./.github/actions/deb-delivery
        with:
          module_name: stream-connectors
          distrib: ${{ matrix.distrib }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-deb-${{ matrix.connector_path }}-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}

  # pulp mirrors the artifactory delivery above;
  # stable is a promotion of the testing packages, keyed on the release/hotfix branch
  deliver-pulp:
    if: ${{ contains(fromJson('["unstable", "testing", "stable"]'), needs.get-environment.outputs.stability) && needs.detect-changes.outputs.delivered_connectors != '[]' }}
    needs: [get-environment, detect-changes, package, test-packages]
    runs-on: centreon-ubuntu-26.04-small
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        distrib: [el8, el9, el10, bookworm, trixie]
        connector_path: ${{ fromJson(needs.detect-changes.outputs.delivered_connectors) }}
        include:
          - distrib: el8
            package_extension: rpm
          - distrib: el9
            package_extension: rpm
          - distrib: el10
            package_extension: rpm
          - distrib: bookworm
            package_extension: deb
          - distrib: trixie
            package_extension: deb
    name: deliver ${{ matrix.distrib }} ${{ matrix.connector_path }} on pulp

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get release type
        if: ${{ needs.get-environment.outputs.stability == 'stable' }}
        id: get_release_type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const commitSha = context.sha;

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sort: 'updated',
              direction: 'desc',
              state: 'closed',
              per_page: 100
            });

            core.startGroup(`Checking pull request linked to commit ${commitSha}`);
            const pr = pulls.data.find(p => {
              console.log(`Checking pull request ${p.number}("${p.title}") with merge commit ${p.merge_commit_sha}`);
              return p.merge_commit_sha === commitSha;
            });
            core.endGroup();
            if (!pr) {
              core.error(`No pull request found for merge commit ${commitSha}`);
              core.setOutput('release_type', '');
              return;
            }

            const prHeadRef = pr?.head?.ref || 'unknown';
            let releaseType = '';
            switch (true) {
              case /^release.+/.test(prHeadRef):
                releaseType = 'release';
                break;
              case /^hotfix.+/.test(prHeadRef):
                releaseType = 'hotfix';
                break;
              default:
                core.error(`No packages are promoted because push of branch ${prHeadRef} is not related to a hotfix/release pull request.`);
                core.setOutput('release_type', '');
                return;
            }
            console.log(`Release type: ${releaseType}`);
            core.setOutput('release_type', releaseType);

      - name: Deliver packages on Pulp
        if: ${{ contains(fromJson('["testing", "unstable"]'), needs.get-environment.outputs.stability) }}
        uses: ./.github/actions/package-delivery-pulp
        with:
          module_name: stream-connectors
          repository_name: plugins
          distrib: ${{ matrix.distrib }}
          version: ""
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-${{ matrix.connector_path }}-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: "false"
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Promote packages on Pulp
        if: ${{ needs.get-environment.outputs.stability == 'stable' && steps.get_release_type.outputs.release_type != '' }}
        uses: ./.github/actions/promote-to-stable-pulp
        with:
          module_name: stream-connectors
          repository_name: plugins
          distrib: ${{ matrix.distrib }}
          major_version: ""
          stability: stable
          release_type: ${{ steps.get_release_type.outputs.release_type }}
          is_cloud: "false"
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}
