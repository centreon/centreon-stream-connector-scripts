name: dependency-scan

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}

on:
  pull_request:
    paths:
      - '!.github/workflows/docker-packaging.yml'
      - '!.github/docker/Dockerfile.packaging-*'
      - '!dependencies/lua-tz/**'
      - '!dependencies/lua-cffi/**'
      - '!dependencies/lua-sql-mysql/**'
      - '!centreon-certified/**'
      - '!packaging/connectors-lib/**'
      - '!modules/centreon-stream-connectors-lib/**'
      - '**'
  workflow_dispatch:

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main
