name: stream-connectors-ci

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# no paths filter: the detect-changes job decides what to run, and the ci-status job
# always reports a result so that it can be used as a required check
on:
  workflow_dispatch:
    inputs:
      build_lib:
        description: "Build and test the library"
        type: boolean
        default: true
      build_connectors:
        description: "Build and test all the stream connectors (always done when build_lib is set)"
        type: boolean
        default: true
      deliver_lib:
        description: "Deliver the library (requires build_lib)"
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - develop
      - master

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  detect-changes:
    needs: [dependency-scan]
    runs-on: ubuntu-24.04
    outputs:
      # a manual run builds, tests and delivers what has been asked through its inputs
      lib: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_lib && 'true' || 'false') || steps.filter.outputs.lib }}
      connectors: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_connectors && 'true' || 'false') || steps.filter.outputs.connectors }}
      # CI changes test everything but do not deliver anything
      ci: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ci }}
      # the library is only delivered when its code or packaging changed
      deliver_lib: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_lib && inputs.deliver_lib && 'true' || 'false') || steps.filter.outputs.lib_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            # this workflow only dispatches the jobs, its own changes do not trigger them
            ci: &ci
              - .github/workflows/stream-connectors-lib.yml
              - .github/workflows/stream-connectors-lib-delivery.yml
              - .github/workflows/stream-connectors.yml
              - .github/workflows/get-environment.yml
              - .github/actions/**
            lib_code: &lib_code
              - modules/centreon-stream-connectors-lib/**
              - packaging/connectors-lib/**
            lib:
              - *ci
              - *lib_code
              - tests/packaging/**
            connectors:
              - *ci
              - centreon-certified/**
              - packaging/connectors/**

  stream-connectors-lib:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.lib == 'true' }}
    uses: ./.github/workflows/stream-connectors-lib.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      pull-requests: read

  # when the library has been rebuilt in this run, the stream connectors are tested
  # against those freshly built packages instead of the ones from the repositories.
  # - the changed stream connectors are built, tested and delivered
  # - a CI change builds and tests all the stream connectors, without delivering them
  # - a library change tests the published packages of the stream connectors that are not built
  stream-connectors:
    needs: [detect-changes, stream-connectors-lib]
    if: ${{ !cancelled() && (needs.detect-changes.outputs.connectors == 'true' || needs.detect-changes.outputs.lib == 'true') && needs.stream-connectors-lib.result != 'failure' }}
    uses: ./.github/workflows/stream-connectors.yml
    with:
      use_local_lib: ${{ needs.stream-connectors-lib.result == 'success' }}
      build_all_connectors: ${{ needs.detect-changes.outputs.ci == 'true' }}
      test_published_connectors: ${{ needs.detect-changes.outputs.lib == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      pull-requests: read

  # the library is delivered only once the stream connectors have also been tested against it
  stream-connectors-lib-delivery:
    needs: [detect-changes, stream-connectors-lib, stream-connectors]
    if: ${{ !cancelled() && needs.detect-changes.outputs.deliver_lib == 'true' && needs.stream-connectors-lib.result == 'success' && needs.stream-connectors.result != 'failure' }}
    uses: ./.github/workflows/stream-connectors-lib-delivery.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      pull-requests: read

  # aggregated result of the workflow, meant to be used as the required check
  ci-status:
    needs: [dependency-scan, detect-changes, stream-connectors-lib, stream-connectors, stream-connectors-lib-delivery]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check jobs result
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "At least one job failed or has been cancelled"
          exit 1
