name: lua-sql-mysql

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lua-sql-mysql.yml'
      - '.version.lua-sql-mysql'
      - 'dependencies/lua-sql-mysql/**'
  push:
    branches:
      - develop
      - master
    tags:
      - 'centreon-stream-connectors-[0-9]+'
    paths:
      - '.github/workflows/lua-sql-mysql.yml'
      - '.version.lua-sql-mysql'
      - 'dependencies/lua-sql-mysql/**'

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  get-environment:
    needs: [dependency-scan]
    uses: ./.github/workflows/get-environment.yml

  package:
    if: ${{ github.ref_type != 'tag' }}
    needs: [get-environment]

    strategy:
      fail-fast: false
      matrix:
        distrib: [el8, el9, el10]
        include:
          - image: packaging-stream-connectors-nfpm-alma8
            distrib: el8
            lua_version: 5.3
          - image: packaging-stream-connectors-nfpm-alma9
            distrib: el9
            lua_version: 5.4
          - image: packaging-stream-connectors-nfpm-alma10
            distrib: el10
            lua_version: 5.4

    runs-on: ubuntu-24.04

    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.image }}:latest
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    name: package ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout luasql sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "lunarmodules/luasql"
          path: "lua-sql-src"
          ref: "2.7.0"

      - name: Prepare packaging of lua-sql-mysql
        env:
          DISTRIB: ${{ matrix.distrib }}
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          dnf install -y dnf-plugins-core
          if [ "$DISTRIB" == "el8" ]; then
            dnf config-manager --set-enabled powertools
          else
            dnf config-manager --set-enabled crb
          fi
          MYSQL_VERSION=""
          if [ "$DISTRIB" == "el10" ]; then
            MYSQL_VERSION="8.4"
          fi
          dnf install -y make gcc lua lua-devel mysql$MYSQL_VERSION mysql$MYSQL_VERSION-devel
          cd lua-sql-src
          make mysql DRIVER_LIBS_mysql="-L/usr/lib64/mysql -lmysqlclient" DRIVER_INCS_mysql=-I/usr/include/mysql LUA_SYS_VER="$LUA_VERSION"
          cd ..

          sed -i "s/@luaver@/${LUA_VERSION}/g" dependencies/lua-sql-mysql/packaging/lua-sql-mysql.yaml
          sed -i "s/@mysql_version@/${MYSQL_VERSION}/g" dependencies/lua-sql-mysql/packaging/lua-sql-mysql.yaml
        shell: bash

      - name: Get package version
        id: package-version
        run: |
          VERSION="$(sed -n 's/^VERSION=//p' .version.lua-sql-mysql)"
          RELEASE="$(sed -n 's/^RELEASE=//p' .version.lua-sql-mysql)"
          if [[ ! "$VERSION" =~ ^[0-9][0-9A-Za-z.]*$ || ! "$RELEASE" =~ ^[0-9]+$ ]]; then
            echo "::error::.version.lua-sql-mysql must hold VERSION=<version> and RELEASE=<number> (got '$VERSION' and '$RELEASE')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Package
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "dependencies/lua-sql-mysql/packaging/*.yaml"
          distrib: ${{ matrix.distrib }}
          package_extension: rpm
          arch: amd64
          version: ${{ steps.package-version.outputs.version }}
          release: ${{ steps.package-version.outputs.release }}
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-lua-sql-mysql-${{ matrix.distrib }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          artifact_name: "package-lua-sql-mysql-${{ matrix.distrib }}"

  test-packages:
    needs: [get-environment, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_extension: rpm
            image: almalinux:8
            distrib: el8
          - package_extension: rpm
            image: almalinux:9
            distrib: el9
          - package_extension: rpm
            image: almalinux:10
            distrib: el10

    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}

    name: Test lua packages on ${{ matrix.package_extension }} ${{ matrix.distrib }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test packaged libs
        uses: ./.github/actions/test-packages
        with:
          package_extension: ${{ matrix.package_extension }}
          distrib: ${{ matrix.distrib }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-lua-sql-mysql-${{ matrix.distrib }}
          test_type: dependency

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install_error_log_${{ matrix.distrib }}
          path: install_error_${{ matrix.distrib }}.log

  deliver-rpm:
    if: ${{ contains(fromJson('["unstable", "testing", "stable"]'), needs.get-environment.outputs.stability) }}
    needs: [get-environment, package, test-packages]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        distrib: [el8, el9, el10]
    name: deliver ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish RPM packages
        uses: ./.github/actions/rpm-delivery
        with:
          module_name: lua-sql-mysql
          distrib: ${{ matrix.distrib }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-lua-sql-mysql-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}

  # pulp mirrors the artifactory delivery above;
  # stable is a promotion of the testing packages, keyed on the release/hotfix branch
  deliver-pulp:
    if: ${{ contains(fromJson('["unstable", "testing", "stable"]'), needs.get-environment.outputs.stability) }}
    needs: [get-environment, package, test-packages]
    runs-on: centreon-ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        distrib: [el8, el9, el10]
        include:
          - distrib: el8
            package_extension: rpm
          - distrib: el9
            package_extension: rpm
          - distrib: el10
            package_extension: rpm
    name: deliver ${{ matrix.distrib }} on pulp

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get release type
        if: ${{ needs.get-environment.outputs.stability == 'stable' }}
        id: get_release_type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const commitSha = context.sha;

            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sort: 'updated',
              direction: 'desc',
              state: 'closed',
              per_page: 100
            });

            core.startGroup(`Checking pull request linked to commit ${commitSha}`);
            const pr = pulls.data.find(p => {
              console.log(`Checking pull request ${p.number}("${p.title}") with merge commit ${p.merge_commit_sha}`);
              return p.merge_commit_sha === commitSha;
            });
            core.endGroup();
            if (!pr) {
              core.error(`No pull request found for merge commit ${commitSha}`);
              core.setOutput('release_type', '');
              return;
            }

            const prHeadRef = pr?.head?.ref || 'unknown';
            let releaseType = '';
            switch (true) {
              case /^release.+/.test(prHeadRef):
                releaseType = 'release';
                break;
              case /^hotfix.+/.test(prHeadRef):
                releaseType = 'hotfix';
                break;
              default:
                core.error(`No packages are promoted because push of branch ${prHeadRef} is not related to a hotfix/release pull request.`);
                core.setOutput('release_type', '');
                return;
            }
            console.log(`Release type: ${releaseType}`);
            core.setOutput('release_type', releaseType);

      - name: Deliver packages on Pulp
        if: ${{ contains(fromJson('["testing", "unstable"]'), needs.get-environment.outputs.stability) }}
        uses: ./.github/actions/package-delivery-pulp
        with:
          module_name: lua-sql-mysql
          repository_name: plugins
          distrib: ${{ matrix.distrib }}
          version: ""
          cache_key: ${{ github.sha }}-${{ github.run_id }}-${{ matrix.package_extension }}-lua-sql-mysql-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: "false"
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      - name: Promote packages on Pulp
        if: ${{ needs.get-environment.outputs.stability == 'stable' && steps.get_release_type.outputs.release_type != '' }}
        uses: ./.github/actions/promote-to-stable-pulp
        with:
          module_name: lua-sql-mysql
          repository_name: plugins
          distrib: ${{ matrix.distrib }}
          major_version: ""
          stability: stable
          release_type: ${{ steps.get_release_type.outputs.release_type }}
          is_cloud: "false"
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

  # a release tag promotes the latest testing packages to stable, nothing is rebuilt
  promote:
    needs: [get-environment]
    if: ${{ github.ref_type == 'tag' && needs.get-environment.outputs.stability == 'stable' && needs.get-environment.outputs.skip_workflow != 'true' }}
    runs-on: centreon-ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        distrib: [el8, el9, el10]
        include:
          - distrib: el8
            package_extension: rpm
          - distrib: el9
            package_extension: rpm
          - distrib: el10
            package_extension: rpm
    name: promote lua-sql-mysql ${{ matrix.distrib }} to stable

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Promote packages on Pulp
        uses: ./.github/actions/promote-to-stable-pulp
        with:
          module_name: lua-sql-mysql
          repository_name: plugins
          distrib: ${{ matrix.distrib }}
          major_version: ""
          stability: stable
          release_type: ${{ needs.get-environment.outputs.release_type }}
          is_cloud: "false"
          pulp_url: ${{ vars.PULP_API_URL }}
          pulp_content_url: ${{ vars.PULP_CONTENT_URL }}
          audience: ${{ vars.PULP_OIDC_AUDIENCE }}

      # jfrog is promoted even if pulp failed, the job still fails
      - name: Promote packages on JFrog
        if: ${{ !cancelled() }}
        uses: ./.github/actions/promote-to-stable-jfrog
        with:
          module_name: lua-sql-mysql
          distrib: ${{ matrix.distrib }}
          package_extension: ${{ matrix.package_extension }}
          release_type: ${{ needs.get-environment.outputs.release_type }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
