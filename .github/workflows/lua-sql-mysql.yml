name: lua-sql-mysql

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lua-sql-mysql.yml'
      - 'dependencies/lua-sql-mysql/**'
  push:
    branches:
      - develop
      - master
    paths:
      - '.github/workflows/lua-sql-mysql.yml'
      - 'dependencies/lua-sql-mysql/**'

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  get-environment:
    needs: [dependency-scan]
    uses: ./.github/workflows/get-environment.yml

  package:
    needs: [get-environment]

    strategy:
      fail-fast: false
      matrix:
        distrib: [el8, el9, el10]
        include:
          - image: packaging-stream-connectors-nfpm-alma8
            distrib: el8
            lua_version: 5.3
          - image: packaging-stream-connectors-nfpm-alma9
            distrib: el9
            lua_version: 5.4
          - image: packaging-stream-connectors-nfpm-alma10
            distrib: el10
            lua_version: 5.4

    runs-on: ubuntu-24.04

    container:
      image: ${{ vars.DOCKER_INTERNAL_REGISTRY_URL }}/${{ matrix.image }}:latest
      credentials:
        username: ${{ secrets.HARBOR_CENTREON_PULL_USERNAME }}
        password: ${{ secrets.HARBOR_CENTREON_PULL_TOKEN }}

    name: package ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout luasql sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "lunarmodules/luasql"
          path: "lua-sql-src"
          ref: "2.7.0"

      - name: Prepare packaging of lua-sql-mysql
        env:
          DISTRIB: ${{ matrix.distrib }}
          LUA_VERSION: ${{ matrix.lua_version }}
        run: |
          dnf install -y dnf-plugins-core
          if [ "$DISTRIB" == "el8" ]; then
            dnf config-manager --set-enabled powertools
          else
            dnf config-manager --set-enabled crb
          fi
          dnf install -y make gcc lua lua-devel mysql mysql-devel
          cd lua-sql-src
          make mysql DRIVER_LIBS_mysql="-L/usr/lib64/mysql -lmysqlclient" DRIVER_INCS_mysql=-I/usr/include/mysql LUA_SYS_VER="$LUA_VERSION"
          cd ..

          sed -i "s/@luaver@/${LUA_VERSION}/g" dependencies/lua-sql-mysql/packaging/lua-sql-mysql.yaml
        shell: bash

      - name: Package
        uses: ./.github/actions/package-nfpm
        with:
          nfpm_file_pattern: "dependencies/lua-sql-mysql/packaging/*.yaml"
          distrib: ${{ matrix.distrib }}
          package_extension: rpm
          arch: amd64
          version: "2.7.0"
          release: "1"
          commit_hash: ${{ github.sha }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-lua-sql-mysql-${{ matrix.distrib }}
          rpm_gpg_key: ${{ secrets.RPM_GPG_SIGNING_KEY }}
          rpm_gpg_signing_key_id: ${{ secrets.RPM_GPG_SIGNING_KEY_ID }}
          rpm_gpg_signing_passphrase: ${{ secrets.RPM_GPG_SIGNING_PASSPHRASE }}
          stability: ${{ needs.get-environment.outputs.stability }}
          artifact_name: "package-lua-sql-mysql-${{ matrix.distrib }}"

  test-packages:
    needs: [get-environment, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_extension: rpm
            image: almalinux:8
            distrib: el8
          - package_extension: rpm
            image: almalinux:9
            distrib: el9
          - package_extension: rpm
            image: almalinux:10
            distrib: el10

    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}

    name: Test lua packages on ${{ matrix.package_extension }} ${{ matrix.distrib }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test packaged libs
        uses: ./.github/actions/test-packages
        with:
          package_extension: ${{ matrix.package_extension }}
          distrib: ${{ matrix.distrib }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-lua-sql-mysql-${{ matrix.distrib }}

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: install_error_log_${{ matrix.distrib }}
          path: install_error_${{ matrix.distrib }}.log

  deliver-rpm:
    if: ${{ contains(fromJson('["unstable", "testing", "stable"]'), needs.get-environment.outputs.stability) }}
    needs: [get-environment, package]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        distrib: [el8, el9, el10]
    name: deliver ${{ matrix.distrib }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish RPM packages
        uses: ./.github/actions/rpm-delivery
        with:
          module_name: lua-sql-mysql
          distrib: ${{ matrix.distrib }}
          artifactory_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          cache_key: ${{ github.sha }}-${{ github.run_id }}-rpm-lua-sql-mysql-${{ matrix.distrib }}
          stability: ${{ needs.get-environment.outputs.stability }}
