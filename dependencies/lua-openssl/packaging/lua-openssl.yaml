name: "lua-openssl"
arch: "${ARCH}"
platform: "linux"
version_schema: "none"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
section: "default"
priority: "optional"
maintainer: "Centreon <contact@centreon.com>"
description: |
  lua OpenSSL binding library
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "MIT"

contents:
  - src: "../lua-openssl/openssl.so"
    dst: "/usr/lib64/lua/@luaver@/openssl.so"
    packager: rpm

  - src: "../lua-openssl/openssl.so"
    dst: "/usr/lib/x86_64-linux-gnu/lua/@luaver@/openssl.so"
    packager: deb

overrides:
  rpm:
    depends:
      - lua
      - openssl
  deb:
    depends:
      - "lua@luaver@"
      - "libssl3 | libssl1.1"

rpm:
  summary: lua OpenSSL binding
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
    key_id: ${RPM_SIGNING_KEY_ID}
