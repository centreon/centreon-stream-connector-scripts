name: "lua-base64"
arch: "${ARCH}"
platform: "linux"
version_schema: "none"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
section: "default"
priority: "optional"
maintainer: "Centreon <contact@centreon.com>"
description: |
  lua base64 encoder/decoder
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

contents:
  - src: "../lbase64/base64.lua"
    dst: "/usr/share/lua/@luaver@/base64"
    packager: rpm

  - src: "../lbase64/base64.lua"
    dst: "/usr/share/lua/@luaver@/base64"
    packager: deb

overrides:
  rpm:
    depends:
      - lua
  deb:
    depends:
      - "lua@luaver@"

rpm:
  summary: lua base64
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
    key_id: ${RPM_SIGNING_KEY_ID}
