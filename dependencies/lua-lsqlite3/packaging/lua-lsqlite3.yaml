name: "lua-lsqlite3"
arch: "${ARCH}"
platform: "linux"
version_schema: "none"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
section: "default"
priority: "optional"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Lua SQLite3 library
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "MIT"

contents:
  - src: "../../../lsqlite3_v@VERSION@/lsqlite3.so"
    dst: "/usr/lib64/lua/@luaver@/lsqlite3.so"
    packager: rpm

  - src: "../../../lsqlite3_v@VERSION@/lsqlite3.so"
    dst: "/usr/lib/x86_64-linux-gnu/lua/@luaver@/lsqlite3.so"
    packager: deb

overrides:
  rpm:
    depends:
      - lua
  deb:
    depends:
      - "lua@luaver@"

rpm:
  summary: Lua SQLite3
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
    key_id: ${RPM_SIGNING_KEY_ID}
